name: Предложение
description: Предложить небольшое улучшение, сохраняя минимализм
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Какую задачу нужно решить?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Предлагаемое поведение
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Альтернативы
      description: Можно ли решить задачу существующими средствами без нового экрана или сервиса?
