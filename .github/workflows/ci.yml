name: macOS CI
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/assets/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/assets/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    name: Intel runner · universal build and tests
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Core tests
        run: swift test
      - name: Build local app
        run: zsh scripts/build-app.sh
      - name: Verify signature and architectures
        run: |
          codesign --verify --strict --verbose=2 dist/VibeWave.app
          lipo dist/VibeWave.app/Contents/MacOS/VibeWave -verify_arch arm64 x86_64
      # Интеграционные проверки модели, импорта MP3/FLAC, папок, drag and drop и окна.
      # Используют временную библиотеку и фикстуры из Checks/Fixtures.
      # У раннера нет видеокарты: окно SwiftUI не может отрисоваться через Metal,
      # поэтому проверки окна выполняются только локально.
      - name: Regression checks
        env:
          VIBEWAVE_SKIP_WINDOW_CHECKS: "1"
        run: zsh scripts/check.sh
      # Проверяет, что DMG, PKG и ZIP собираются; артефакты никуда не публикуются.
      - name: Package installers
        run: zsh scripts/package-release.sh "$RUNNER_TEMP/release"
